name: Plugin Verifier

# The verifier downloads whole IDEs, so it runs on demand and before a release
# rather than on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run the IntelliJ Plugin Verifier
        run: ./gradlew verifyPlugin --no-daemon

      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifier-report
          path: build/reports/pluginVerifier
