name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify
        run: ./gradlew test verifyPluginStructure --no-daemon

      - name: Build the plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true

      # Publishing to the Marketplace is a separate, deliberate step: it needs a
      # token, and a bad release there cannot be withdrawn as easily as a tag.
      - name: Publish to the JetBrains Marketplace
        if: ${{ vars.PUBLISH_TO_MARKETPLACE == 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon
