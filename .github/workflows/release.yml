name: Release

# Releasing is a dispatch, not a tag push. The workflow writes the changelog entry
# for the version, builds, and only then commits and tags -- so the tag always points
# at a commit containing its own changelog, and a build that fails leaves main
# untouched. A tag pushed by hand does nothing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (for example 0.1.3)'
        required: true
        type: string

permissions:
  contents: write

# Two releases must never interleave: both push main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # First, because it is the only step that validates the version, and it refuses
      # to release a version whose [Unreleased] section says nothing.
      - name: Cut the changelog
        env:
          VERSION: ${{ inputs.version }}
        run: .github/scripts/cut-changelog.sh "$VERSION" "$(date -u +%Y-%m-%d)"

      - name: Check the version is free
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists. Delete it, or pick another version." >&2
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists." >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
        run: ./gradlew test verifyPluginStructure --no-daemon

      # The rule was written down twice -- in the notes and in verify-plugin.yml's own
      # header -- and lived in neither pipeline, so 0.2.0 shipped a call to an API
      # scheduled for removal and the Marketplace found it instead of us. It runs here
      # rather than on every push because it downloads whole IDEs, and here is where it
      # pays: nothing is committed, tagged or published after it.
      - name: Verify against the recommended IDEs
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
        run: ./gradlew verifyPlugin --no-daemon

      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-report
          path: build/reports/pluginVerifier

      - name: Build the plugin
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew buildPlugin --no-daemon

      # Nothing has been pushed until here, so a red build costs a workflow run and
      # nothing else. The push of main fails rather than rebasing if someone landed a
      # commit meanwhile: the artifact above was built from this tree, not that one.
      - name: Commit the changelog and tag it
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md was already current for $VERSION."
          else
            git commit -m "Cut $VERSION in the changelog"
            git push origin main
          fi
          git tag -a "v$VERSION" -m "$VERSION"
          git push origin "v$VERSION"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # Notes come from the changelog rather than from --generate-notes. A list of merged
          # pull request titles records what landed, not what changed for someone installing
          # the plugin, and it appends a "New Contributors" block that says nothing on a
          # single-author repository. The section exists by now because the cut ran first, and
          # the script fails on a missing or empty one, so a release cannot quietly ship notes
          # that say nothing.
          .github/scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"

          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            build/distributions/*.zip

      # An update to a signed plugin must itself be signed, and the Marketplace refuses
      # the upload if it is not -- after the tag and the GitHub release already exist. If
      # the key ever goes missing, this says so before anything is published rather than
      # leaving a release the Marketplace will not take.
      - name: Refuse to publish unsigned
        if: ${{ vars.PUBLISH_TO_MARKETPLACE == 'true' }}
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$PRIVATE_KEY" ] || missing="$missing PRIVATE_KEY"
          [ -n "$CERTIFICATE_CHAIN" ] || missing="$missing CERTIFICATE_CHAIN"
          [ -n "$PRIVATE_KEY_PASSWORD" ] || missing="$missing PRIVATE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "PUBLISH_TO_MARKETPLACE is on, but signing is not configured:$missing" >&2
            echo "Publishing unsigned would be refused, since earlier versions are signed." >&2
            exit 1
          fi

      # A separate, deliberate step: a bad release on the Marketplace cannot be
      # withdrawn as easily as a tag, so releasing alone never publishes there.
      - name: Publish to the JetBrains Marketplace
        if: ${{ vars.PUBLISH_TO_MARKETPLACE == 'true' }}
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin --no-daemon
